apiVersion: batch/v1
kind: Job
metadata:
  name: latency-predictor-stress-test
  labels:
    app: latency-predictor-test
    component: stress-test
spec:
  parallelism: 10
  completions: 10
  completionMode: Indexed
  template:
    metadata:
      labels:
        app: latency-predictor-test
        component: stress-test
    spec:
      restartPolicy: Never
      containers:
        - name: test-runner
          image: placeholder-for-test-image
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
          env:
            - name: TRAINING_SERVER_URL
              value: "http://training-service:8000"
            - name: PREDICTION_SERVER_URL
              value: "http://prediction-service:80"
            - name: TEST_TIMEOUT
              value: "300"
            - name: TARGET_QPS
              value: "400"
            - name: TARGET_QPS_LARGE_BATCH
              value: "40"
            - name: RUN_TRAINING_WARMUP
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["pytest"]
          args:
            - "-v"
            - "-s"
            - "--no-header"
            - "tests/test_dual_server_client.py"
            - "-k"
            - "stress"
          volumeMounts:
            - name: test-results
              mountPath: /test-results
      volumes:
        - name: test-results
          emptyDir: {}
  backoffLimit: 1
