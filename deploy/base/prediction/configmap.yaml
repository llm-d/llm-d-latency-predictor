# --- Prediction server ConfigMap ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-server-config
data:
  MODEL_SYNC_INTERVAL_SEC: "10"  # Download models every 10 seconds
  LOCAL_MODEL_DIR: "/local_models"
  LATENCY_MODEL_TYPE: "xgboost"
  PREDICT_HOST: "0.0.0.0"
  PREDICT_PORT: "8001"
  # NOTE: if you set a namePrefix in an overlay, update this URL to match the
  # prefixed training Service name (kustomize does not rewrite string values).
  TRAINING_SERVER_URL: "http://training-service:8000"
  HTTP_TIMEOUT: "30"
