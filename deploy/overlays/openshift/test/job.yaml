apiVersion: batch/v1
kind: Job
metadata:
  name: latency-predictor-functional-test
spec:
  template:
    spec:
      nodeSelector: null
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: test-runner
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
