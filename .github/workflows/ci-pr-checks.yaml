name: CI - PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  # Detect if PR contains code changes (skip expensive checks for docs-only PRs)
  check-code-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_code_changes: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Check for code changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!OWNERS'

  # Lint: runs all pre-commit hooks (ruff, shellcheck, hadolint, markdownlint, yamllint, etc.)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Verify the restructured layout is importable
  import-check:
    runs-on: ubuntu-latest
    needs: check-code-changes
    if: needs.check-code-changes.outputs.has_code_changes == 'true'
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check imports
        run: |
          pip install -r requirements.txt --quiet
          python -c "
          import importlib
          for mod in ['prediction.prediction_server', 'training.training_server', 'common.types']:
              imported = importlib.import_module(mod)
              print(f'{mod}: {imported.__file__}')
          "

      - name: Run unit tests
        run: |
          pip install pytest --quiet
          pytest tests/test_training_server.py tests/test_prediction_server_import.py -v
